<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Older adult walking from a parked car toward neighbourhood shops</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEBF8"/>
      <stop offset="1" stop-color="#F6FAFD"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D3DE"/>
      <stop offset="1" stop-color="#B7C3D0"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B7CC2"/>
      <stop offset="1" stop-color="#1A5F9C"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1380" cy="150" r="70" fill="#FFF3CF"/>
  <circle cx="1380" cy="150" r="110" fill="#FFF3CF" opacity=".35"/>
  <g fill="#fff" opacity=".9">
