  <!-- older adult walking toward the shops -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(702 712) scale(1.3) translate(-702 -712)">
    <ellipse cx="702" cy="712" rx="52" ry="7" fill="#AEB8C4" opacity=".45"/>
    <!-- back leg -->
    <path d="M697 608 L684 655 L668 703" fill="none" stroke="#3F4A5A" stroke-width="20"/>
    <path d="M656 699 h28 q8 0 8 8 v4 h-40 q-4 -12 4 -12z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- back arm + bag -->
    <path d="M690 532 L678 572 L672 598" fill="none" stroke="#2F7A8E" stroke-width="15"/>
    <circle cx="671" cy="602" r="7" fill="#EDC4A3"/>
    <path d="M661 604 q10 -18 20 0" fill="none" stroke="#B5835A" stroke-width="4"/>
    <rect x="650" y="604" width="42" height="44" rx="6" fill="#E9C46A"/>
    <!-- front leg -->
    <path d="M707 608 L722 655 L738 701" fill="none" stroke="#4B5767" stroke-width="20"/>
    <path d="M728 697 h30 q8 0 8 8 v6 h-42 q-4 -14 4 -14z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- torso / cardigan -->
    <path d="M680 528 Q700 516 720 528 L728 618 Q702 628 676 618 Z" fill="#3A8DA3"/>
    <path d="M702 522 L703 620" stroke="#2F7A8E" stroke-width="3" fill="none"/>
    <!-- front arm -->
    <path d="M714 532 L728 572 L742 600" fill="none" stroke="#3A8DA3" stroke-width="15"/>
    <circle cx="744" cy="604" r="7" fill="#EDC4A3"/>
    <!-- neck + head -->
    <rect x="696" y="506" width="12" height="18" rx="5" fill="#EDC4A3"/>
    <circle cx="706" cy="488" r="25" fill="#EDC4A3"/>
    <path d="M682 492 Q676 458 706 456 Q732 456 734 476 Q722 468 708 472 Q696 476 694 498 Q690 504 682 492 Z" fill="#D5D9DF"/>
    <circle cx="719" cy="486" r="2.4" fill="#3F4A5A"/>
    <path d="M716 499 q5 3 10 0" fill="none" stroke="#B9785E" stroke-width="2"/>
  </g>
</svg>
