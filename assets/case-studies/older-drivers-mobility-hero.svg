    <path d="M95 812 L95 748 Q97 730 118 725 L198 712 L268 652 Q280 642 298 642 L452 642 Q474 642 486 656 L548 724 Q568 730 568 752 L568 812 Q568 822 558 822 L105 822 Q95 822 95 812 Z" fill="url(#car)"/>
    <path d="M284 658 L362 658 L362 708 L222 708 Z" fill="#DCEBF8"/>
    <path d="M376 658 L450 658 Q462 658 470 668 L510 708 L376 708 Z" fill="#DCEBF8"/>
    <path d="M300 664 l30 0 l-38 38 l-22 0z" fill="#fff" opacity=".5"/>
