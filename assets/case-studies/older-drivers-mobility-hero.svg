    <path d="M760 420 h24 l-4 -22 h-16z" fill="#5B6B7D"/>
    <circle cx="772" cy="402" r="7" fill="#FFF3CF"/>
  </g>

  <!-- sidewalk -->
  <rect x="0" y="660" width="1600" height="70" fill="#E9EEF3"/>
  <g stroke="#D7DEE6" stroke-width="2">
    <path d="M100 660 l-20 70 M260 660 l-20 70 M420 660 l-20 70 M580 660 l-20 70 M740 660 l-20 70 M900 660 l-20 70 M1060 660 l-20 70 M1220 660 l-20 70 M1380 660 l-20 70 M1540 660 l-20 70"/>
