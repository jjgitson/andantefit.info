      <path d="M1115 450 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0 q15.6 22 31.25 0z" fill="#2A9D8F"/>
      <path d="M1146.25 410 h31.25 v40 h-31.25z M1208.75 410 h31.25 v40 h-31.25z M1271.25 410 h31.25 v40 h-31.25z M1333.75 410 h31.25 v40 h-31.25z" fill="#fff" opacity=".4"/>
