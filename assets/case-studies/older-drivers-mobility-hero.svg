    <rect x="1000" y="470" width="70" height="195" rx="3" fill="#7FA8CC"/>
    <circle cx="1060" cy="570" r="4" fill="#fff"/>
    <g>
      <path d="M815 410 h270 v40 h-270z" fill="#F4A261"/>
      <path d="M815 450 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0 q16.9 22 33.75 0z" fill="#F4A261"/>
      <path d="M848.75 410 h33.75 v40 h-33.75z M916.25 410 h33.75 v40 h-33.75z M983.75 410 h33.75 v40 h-33.75z M1051.25 410 h33.75 v40 h-33.75z" fill="#fff" opacity=".55"/>
