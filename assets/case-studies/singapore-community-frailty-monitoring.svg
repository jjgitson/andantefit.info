<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">Illustrative community-level frailty monitoring in Singapore</title>
<desc id="desc">A policy communication concept showing hypothetical SPPB-based frailty levels across Singapore regions.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071629" flood-opacity=".35"/></filter>
  <style>
    .label{font-family:Arial,sans-serif;fill:#e8f0f7}.small{font-size:15px}.region{stroke:#071b33;stroke-width:4}.title{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.muted{font-family:Arial,sans-serif;fill:#a9bac9}.legend{font-family:Arial,sans-serif;fill:#dce8f2;font-size:15px}
  </style>
</defs>
<rect width="800" height="720" rx="28" fill="#09223b"/>
<text x="400" y="62" text-anchor="middle" class="title" font-size="26">ILLUSTRATIVE COMMUNITY-LEVEL FRAILTY MONITORING</text>
<text x="400" y="92" text-anchor="middle" class="muted" font-size="17">Hypothetical SPPB-based risk distribution across Singapore</text>
