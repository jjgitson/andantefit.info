  <path class="region" d="M463 101 L533 130 L598 169 L626 214 L567 225 L508 203 L497 154 Z" fill="#f3a53c"/>
  <path class="region" d="M184 235 L229 210 L291 201 L322 251 L283 309 L214 318 L138 366 L92 330 L58 286 L129 249 Z" fill="#88c976"/>
  <path class="region" d="M291 201 L376 202 L404 253 L381 314 L316 348 L257 382 L214 318 L283 309 L322 251 Z" fill="#f0d64f"/>
  <path class="region" d="M376 202 L452 203 L508 203 L531 260 L505 314 L438 319 L385 354 L381 314 L404 253 Z" fill="#f3a342"/>
