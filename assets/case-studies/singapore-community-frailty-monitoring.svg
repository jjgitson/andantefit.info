  <text x="350" y="289" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#09223b">C</text>
  <text x="90" y="205" class="label small">WEST</text>
  <text x="242" y="143" class="label small">NORTH</text>
  <text x="402" y="151" class="label small">NORTH-EAST</text>
  <text x="524" y="181" class="label small">EAST</text>
  <text x="312" y="401" class="label small">CENTRAL</text>
</g>
<g transform="translate(105 575)">
  <text x="0" y="0" class="title" font-size="18">Illustrative SPPB risk level</text>
  <rect x="0" y="24" width="28" height="22" rx="4" fill="#48a8b7"/><text x="40" y="41" class="legend">Lower risk</text>
  <rect x="160" y="24" width="28" height="22" rx="4" fill="#9bcf75"/><text x="200" y="41" class="legend">Mild</text>
  <rect x="290" y="24" width="28" height="22" rx="4" fill="#f1d64a"/><text x="330" y="41" class="legend">Moderate</text>
  <rect x="445" y="24" width="28" height="22" rx="4" fill="#f3a53c"/><text x="485" y="41" class="legend">High</text>
  <rect x="565" y="24" width="28" height="22" rx="4" fill="#df6148"/><text x="605" y="41" class="legend">Very high</text>
</g>
<text x="400" y="675" text-anchor="middle" class="muted" font-size="15">Policy communication concept only — not observed epidemiological data</text>
</svg>