<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis { stroke:#222; stroke-width:1.2; }
    .grid { stroke:#e6e6e6; stroke-width:1; }
    .label { font-family: sans-serif; font-size:12px; fill:#333; }
    .title { font-family: sans-serif; font-size:16px; fill:#111; }
    .p { stroke:#f28e2b; stroke-width:3; fill:none; }
    .n { stroke:#2f4b5b; stroke-width:3; fill:none; }
  </style>

  <!-- 제목 -->
  <text x="500" y="24" text-anchor="middle" class="title">
    참여군과 비참여군의 1인당 누적 건강보험·요양급여 비용 추이
  </text>

  <!-- 축 -->
  <line x1="80" y1="360" x2="950" y2="360" class="axis"/>
  <line x1="80" y1="40" x2="80" y2="360" class="axis"/>

  <!-- 격자 -->
  <g class="grid">
    <line x1="80" y1="360" x2="950" y2="360"/>
    <line x1="80" y1="300" x2="950" y2="300"/>
    <line x1="80" y1="240" x2="950" y2="240"/>
    <line x1="80" y1="180" x2="950" y2="180"/>
    <line x1="80" y1="120" x2="950" y2="120"/>
    <line x1="80" y1="60" x2="950" y2="60"/>
  </g>

  <!-- y축 라벨 -->
  <g class="label">
    <text x="20" y="365">0</text>
    <text x="20" y="305">500만</text>
    <text x="20" y="245">1,000만</text>
    <text x="20" y="185">1,500만</text>
    <text x="20" y="125">2,000만</text>
    <text x="20" y="65">2,500만</text>
  </g>

  <!-- x축 라벨 -->
  <g class="label">
    <text x="120" y="385">6</text>
    <text x="220" y="385">12</text>
    <text x="320" y="385">18</text>
    <text x="420" y="385">24</text>
    <text x="520" y="385">30</text>
    <text x="620" y="385">36</text>
    <text x="720" y="385">48</text>
    <text x="820" y="385">60</text>
    <text x="900" y="385">66개월</text>
  </g>

  <!-- 참여군 (주황) -->
  <polyline class="p"
    points="80,350 200,330 300,315 400,295 500,275 600,255 700,230 800,210 900,190"/>

  <!-- 비참여군 (청록) -->
  <polyline class="n"
    points="80,340 200,310 300,290 400,260 500,240 600,215 700,190 800,160 900,130"/>

  <!-- 범례 -->
  <rect x="760" y="60" width="18" height="4" fill="#f28e2b"/>
  <text x="785" y="65" class="label">참여군</text>

  <rect x="760" y="80" width="18" height="4" fill="#2f4b5b"/>
  <text x="785" y="85" class="label">비참여군</text>
</svg>
