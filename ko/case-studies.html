<script>
(function(){'use strict';
const GITHUB_CONFIG={owner:'jjgitson',repo:'andantefit.info',folder:'ko/case-studies',branch:'main'};const ALLOWED_LANGS=['KR','EN'];

function parseFilename(filename){const m=filename.match(/^(\d{4})-(\d{2})-(\d{2})-(.+)\.html$/);if(!m)return null;const[,y,mo,d,fileKey]=m,langMatch=fileKey.match(/-(EN|KR|ES|JP)$/),lang=langMatch?langMatch[1]:null,titleKey=lang?fileKey.slice(0,-('-'+lang).length):fileKey;return{date:new Date(Number(y),Number(mo)-1,Number(d)),dateStr:`${y}.${mo}.${d}`,title:customTitles[titleKey]||titleKey.replace(/-/g,' '),lang,filename,fileKey}}

async function load(){const c=document.getElementById('caseStudiesContainer');if(!c)return;try{const api=`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.folder}?ref=${GITHUB_CONFIG.branch}`,r=await fetch(api),data=await r.json();if(!r.ok||!Array.isArray(data))throw new Error('목록을 불러오지 못했습니다.');const items=data.filter(f=>f.type==='file'&&f.name.endsWith('.html')).map(f=>{const p=parseFilename(f.name);if(!p||!ALLOWED_LANGS.includes(p.lang))return null;p.url='/'+GITHUB_CONFIG.folder+'/'+encodeURIComponent(f.name);return p}).filter(Boolean).sort((a,b)=>b.date-a.date);localStorage.setItem(CACHE_KEY,JSON.stringify(items));localStorage.setItem(CACHE_TIME_KEY,String(Date.now()));render(c,items)}catch(e){const cached=localStorage.getItem(CACHE_KEY);if(cached)render(c,JSON.parse(cached));else c.innerHTML='<p style="padding:30px;color:#dc2626">리포트 목록을 불러오지 못했습니다.</p>'}}
